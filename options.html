<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Note-o-Web – Options</title>
<style>
  body{max-width:720px;margin:32px auto;padding:0 16px;font:15px/1.5 system-ui,"Segoe UI",sans-serif;color:#111}
  h1{margin-bottom:4px}
  .card{border:1px solid #e5e7eb;border-radius:12px;padding:16px 20px;margin:16px 0}
  .card h2{margin:0 0 8px;font-size:17px}
  .stats{display:flex;gap:24px;flex-wrap:wrap}
  .stats div{font-size:13px;color:#6b7280}
  .stats b{display:block;font-size:22px;color:#111}
  button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #d1d5db;background:#f9fafb;cursor:pointer}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  button.danger{color:#b91c1c}
  button:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .msg{margin-top:10px;font-size:14px}
  .ok{color:#15803d}.err{color:#b91c1c}
  .muted{color:#6b7280;font-size:13px}
  .prov{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 0;border-top:1px solid #f1f5f9}
  .prov:first-child{border-top:0}
  .prov .name{min-width:110px;font-weight:600}
  .prov input[type=text]{flex:1;min-width:180px;font:inherit;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px}
  .badge{font-size:12px;padding:2px 8px;border-radius:99px;background:#e5e7eb;color:#374151}
  .badge.on{background:#dcfce7;color:#166534}
  code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:12px;word-break:break-all}
  kbd{background:#f3f4f6;border:1px solid #d1d5db;border-radius:4px;padding:1px 6px;font-size:12px}
</style>
</head>
<body>
<h1>🗒 Note-o-Web</h1>
<div class="muted" data-i18n="opt.tagline"></div>

<div class="card">
  <div class="row" style="margin-top:0">
    <label for="lang" data-i18n="opt.language"></label>
    <select id="lang">
      <option value="auto" data-i18n="opt.langAuto"></option>
      <option value="en">English</option>
      <option value="de">Deutsch</option>
    </select>
  </div>
</div>

<div class="card">
  <h2 data-i18n="opt.overview"></h2>
  <div class="stats">
    <div><b id="sPages">–</b><span data-i18n="opt.pages"></span></div>
    <div><b id="sHl">–</b><span data-i18n="opt.highlights"></span></div>
    <div><b id="sPi">–</b><span data-i18n="opt.postits"></span></div>
    <div><b id="sBytes">–</b><span data-i18n="opt.storage"></span></div>
  </div>
</div>

<div class="card">
  <h2 data-i18n="opt.backupTitle"></h2>
  <div class="row">
    <button class="primary" id="btnExport" data-i18n="opt.download"></button>
  </div>
  <div class="row">
    <input type="file" id="file" accept="application/json,.json">
    <label><input type="radio" name="mode" value="merge" checked> <span data-i18n="opt.merge"></span></label>
    <label><input type="radio" name="mode" value="replace"> <span data-i18n="opt.replace"></span></label>
    <button id="btnRestore" data-i18n="opt.restore"></button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <h2 data-i18n="opt.cloudTitle"></h2>
  <div class="muted" data-i18n="opt.cloudIntro"></div>
  <div id="providers"></div>
  <div class="row">
    <button id="btnNow" data-i18n="opt.backupNow"></button>
    <button id="btnCloudRestore" data-i18n="opt.cloudRestore"></button>
    <span class="muted" data-i18n="opt.modeHint"></span>
  </div>
  <div class="msg" id="cmsg"></div>
  <div class="muted" id="cstatus"></div>
  <details class="muted" style="margin-top:10px">
    <summary data-i18n="opt.regData"></summary>
    <div><span data-i18n="opt.redirect"></span> <code id="redir"></code></div>
    <div><span data-i18n="opt.extId"></span> <code id="extid"></code></div>
    <div data-i18n="opt.guide" data-i18n-html></div>
  </details>
</div>

<div class="card">
  <h2 data-i18n="opt.notes"></h2>
  <div class="muted" data-i18n="opt.shortcut" data-i18n-html></div>
  <div class="row"><button class="danger" id="btnWipe" data-i18n="opt.wipe"></button></div>
</div>

<script src="shared.js"></script>
<script src="i18n.js"></script>
<script src="backup.js"></script>
<script src="options.js"></script>
</body>
</html>
